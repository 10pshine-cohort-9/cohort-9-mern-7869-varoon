# ────────────────────────────────────────────
# SonarQube Configuration — Notes App
# ────────────────────────────────────────────

sonar.projectKey=notes-app
sonar.projectName=Notes App
sonar.projectVersion=1.0.0

# Source paths (backend + frontend)
sonar.sources=src,client/src

# Test paths (backend Mocha + frontend Vitest)
sonar.tests=src/tests,client/src/tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Encoding
sonar.sourceEncoding=UTF-8

# JavaScript / TypeScript language configuration
sonar.language=js

# Coverage report paths (both Mocha and Vitest produce lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info,client/coverage/lcov.info
